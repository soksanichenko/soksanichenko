name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate pin card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: pin
          options: username=AlmaLinux&repo=mirrors
          path: profile/pin-mirrors.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Commit cards via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GRS_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          CHANGED=$(git diff --name-only HEAD -- profile/)

          if [ -z "$CHANGED" ]; then
            echo "No changes to commit"
            exit 0
          fi

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "Updating $FILE..."
            CONTENT=$(base64 -w 0 "$FILE")
            SHA=$(gh api "repos/$REPO/contents/$FILE" --jq '.sha')
            gh api "repos/$REPO/contents/$FILE" \
              --method PUT \
              --field message="Update README cards" \
              --field content="$CONTENT" \
              --field sha="$SHA"
          done <<< "$CHANGED"
